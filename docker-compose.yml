services:
  airconnect:
    image: 1activegeek/airconnect:1.8.3
    container_name: AirConnect
    network_mode: host
    restart: unless-stopped

  dns_updater:
    image: tutkowskim/dns-updater:2026.01.11.0127
    container_name: DnsUpdater
    environment:
      - PORT=8080
      - SENTRY_DSN=${DNS_UPDATER_SENTRY_DSN}
      - AWS_REGION=${DNS_UPDATER_AWS_REGION}
      - AWS_ACCESS_KEY_ID=${DNS_UPDATER_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${DNS_UPDATER_AWS_SECRET_ACCESS_KEY}
      - HOSTED_ZONE_ID=${DNS_UPDATER_HOSTED_ZONE_ID}
      - RECORD_NAME=${DNS_UPDATER_RECORD_NAME}
    restart: unless-stopped

  the_voice:
    image: tutkowskim/the-voice:2026.08.16.1925
    container_name: TheVoice
    environment:
      - SENTRY_DSN=${THE_VOICE_SENTRY_DSN}
      - TOKEN=${THE_VOICE_TOKEN}
      - OPENAI_API_KEY=${THE_VOICE_OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-5.2
    restart: unless-stopped

  discord_mcp_server:
    image: tutkowskim/discord-mcp-server:2026.08.23.0501
    container_name: DiscordMcpServer
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_MCP_BOT_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_MCP_GUILD_ID}
      - DISCORD_ALLOWED_CHANNEL_IDS=*
      - CONTROL_PLANE_API_KEY=${DISCORD_MCP_CONTROL_PLANE_API_KEY}
      - CONTROL_PLANE_TUNNEL_ID=${DISCORD_MCP_CONTROL_PLANE_TUNNEL_ID}
      - MCP_COMMAND=python -m discord_mcp_server
      - HEALTH_LISTEN_ADDR=:8080
      - LOG_FORMAT=json
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  kasa_mcp_server:
    image: tutkowskim/kasa-mcp-server:latest
    container_name: KasaMcpServer
    network_mode: host
    environment:
      - KASA_USERNAME=${KASA_MCP_USERNAME}
      - KASA_PASSWORD=${KASA_MCP_PASSWORD}
      - KASA_DEVICE_HOSTS=${KASA_MCP_DEVICE_HOSTS}
      - KASA_DISCOVERY_TARGET=${KASA_MCP_DISCOVERY_TARGET:-255.255.255.255}
      - KASA_ALLOWED_DEVICE_IDS=${KASA_MCP_ALLOWED_DEVICE_IDS}
      - KASA_DISCOVERY_TIMEOUT_SECONDS=5
      - KASA_REQUEST_TIMEOUT_SECONDS=10
      - KASA_MAX_CONCURRENT_REQUESTS=4
      - KASA_CACHE_TTL_SECONDS=60
      - CONTROL_PLANE_API_KEY=${KASA_MCP_CONTROL_PLANE_API_KEY}
      - CONTROL_PLANE_TUNNEL_ID=${KASA_MCP_CONTROL_PLANE_TUNNEL_ID}
      - MCP_COMMAND=python -m kasa_mcp_server
      - HEALTH_LISTEN_ADDR=127.0.0.1:8081
      - LOG_FORMAT=json
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf

configs:
  nginx_config:
    content: |
      server {
          listen 80;
          server_name portainer.tutkowski.com;
          location / {
              proxy_pass http://host.docker.internal:9000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$host;
          }
      }
      server {
          listen 80;
          server_name olamma.tutkowski.com;
          location / {
              proxy_pass http://dev.tutkowski.com:11434;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$host;
          }
      }
