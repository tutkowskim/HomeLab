services:
  airconnect:
    image: 1activegeek/airconnect:1.8.3
    networks:
      - hostnet
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s

  hermes_agent:
    image: nousresearch/hermes-agent:v2026.8.31
    command: ["gateway", "run"]
    networks:
      - appnet
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
    volumes:
      - hermes_data:/opt/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == raspberrypi4
      restart_policy:
        condition: any
        delay: 5s

  # dns_updater:
  #   image: tutkowskim/dns-updater:2026.09.01.1554
  #   container_name: DnsUpdater
  #   environment:
  #     - PORT=8080
  #     - SENTRY_DSN=${DNS_UPDATER_SENTRY_DSN}
  #     - AWS_REGION=${DNS_UPDATER_AWS_REGION}
  #     - AWS_ACCESS_KEY_ID=${DNS_UPDATER_AWS_ACCESS_KEY_ID}
  #     - AWS_SECRET_ACCESS_KEY=${DNS_UPDATER_AWS_SECRET_ACCESS_KEY}
  #     - HOSTED_ZONE_ID=${DNS_UPDATER_HOSTED_ZONE_ID}
  #     - RECORD_NAME=${DNS_UPDATER_RECORD_NAME}
  #   restart: unless-stopped

  kasa_mcp_server:
    image: tutkowskim/kasa-mcp-server:2026.08.30.2024
    container_name: KasaMcpServer
    networks:
      - hostnet
    environment:
      - KASA_USERNAME=${KASA_MCP_USERNAME}
      - KASA_PASSWORD=${KASA_MCP_PASSWORD}
      - KASA_DEVICE_HOSTS=${KASA_MCP_DEVICE_HOSTS}
      - KASA_DISCOVERY_TARGET=${KASA_MCP_DISCOVERY_TARGET:-255.255.255.255}
      - KASA_ALLOWED_DEVICE_IDS=${KASA_MCP_ALLOWED_DEVICE_IDS}
      - KASA_DISCOVERY_TIMEOUT_SECONDS=5
      - KASA_REQUEST_TIMEOUT_SECONDS=10
      - KASA_MAX_CONCURRENT_REQUESTS=4
      - KASA_CACHE_TTL_SECONDS=60
      - KASA_MCP_HOST=0.0.0.0
      - KASA_MCP_PORT=8001
      - KASA_MCP_ALLOWED_HOSTS=127.0.0.1:8001,kasa-mcp.tutkowski.com
      - KASA_MCP_MAX_REQUEST_BODY_BYTES=4194304
      - KASA_MCP_LOG_LEVEL=DEBUG
      - SENTRY_DSN=${KASA_MCP_SENTRY_DSN}
      - SENTRY_ENVIRONMENT=${KASA_MCP_SENTRY_ENVIRONMENT:-production}
      - SENTRY_TRACES_SAMPLE_RATE=${KASA_MCP_SENTRY_TRACES_SAMPLE_RATE:-1.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == raspberrypi3
      restart_policy:
        condition: any
        delay: 5s

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    networks:
      - appnet
    deploy:
      placement:
        constraints:
          - node.hostname == raspberrypi4
      restart_policy:
        condition: any
        delay: 5s
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    configs:
      - source: nginx_config_v4
        target: /etc/nginx/conf.d/default.conf

configs:
  nginx_config_v4:
    file: ./nginx.conf

volumes:
  hermes_data:

networks:
  appnet:
    driver: overlay
  hostnet:
    external: true
    name: host
