services:
  airconnect:
    image: 1activegeek/airconnect:1.8.3
    container_name: AirConnect
    network_mode: host
    restart: unless-stopped

  dns_updater:
    image: tutkowskim/dns-updater:2026.01.11.0127
    container_name: DnsUpdater
    environment:
      - PORT=8080
      - SENTRY_DSN=${DNS_UPDATER_SENTRY_DSN}
      - AWS_REGION=${DNS_UPDATER_AWS_REGION}
      - AWS_ACCESS_KEY_ID=${DNS_UPDATER_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${DNS_UPDATER_AWS_SECRET_ACCESS_KEY}
      - HOSTED_ZONE_ID=${DNS_UPDATER_HOSTED_ZONE_ID}
      - RECORD_NAME=${DNS_UPDATER_RECORD_NAME}
    restart: unless-stopped

  the_voice:
    image: tutkowskim/the-voice:2026.08.16.1925
    container_name: TheVoice
    environment:
      - SENTRY_DSN=${THE_VOICE_SENTRY_DSN}
      - TOKEN=${THE_VOICE_TOKEN}
      - OPENAI_API_KEY=${THE_VOICE_OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-5.2
    restart: unless-stopped

  discord_mcp_server:
    image: tutkowskim/discord-mcp-server:latest
    container_name: DiscordMcpServer
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_MCP_BOT_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_MCP_GUILD_ID}
      - DISCORD_ALLOWED_CHANNEL_IDS=*
      - DISCORD_CACHE_ENABLED=true
      - REDIS_URL=redis://discord_mcp_redis:6379/0
      - REDIS_PASSWORD=${DISCORD_MCP_REDIS_PASSWORD}
      - CONTROL_PLANE_API_KEY=${DISCORD_MCP_CONTROL_PLANE_API_KEY}
      - CONTROL_PLANE_TUNNEL_ID=${DISCORD_MCP_CONTROL_PLANE_TUNNEL_ID}
      - MCP_COMMAND=python -m discord_mcp_server
      - HEALTH_LISTEN_ADDR=:8080
      - LOG_FORMAT=json
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - discord_mcp_redis
    restart: unless-stopped

  discord_mcp_redis:
    image: redis:8.2-alpine@sha256:a7859ed111db3c1f5404a973a4747505d559fb5ca32d37e447afc0ef845a2103
    container_name: DiscordMcpRedis
    command:
      - redis-server
      - --requirepass
      - ${DISCORD_MCP_REDIS_PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      - REDIS_PASSWORD=${DISCORD_MCP_REDIS_PASSWORD}
    user: "999:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    tmpfs:
      - /data:size=128m,uid=999,gid=1000,mode=0700
    restart: unless-stopped

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf

configs:
  nginx_config:
    content: |
      server {
          listen 80;
          server_name portainer.tutkowski.com;
          location / {
              proxy_pass http://host.docker.internal:9000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$host;
          }
      }
      server {
          listen 80;
          server_name olamma.tutkowski.com;
          location / {
              proxy_pass http://dev.tutkowski.com:11434;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$host;
          }
      }
