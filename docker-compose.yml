services:
  airconnect:
    image: 1activegeek/airconnect:1.8.3
    container_name: AirConnect
    network_mode: host
    restart: unless-stopped

  dns_updater:
    image: tutkowskim/dns-updater:2026.01.11.0127
    container_name: DnsUpdater
    environment:
      - PORT=8080
      - SENTRY_DSN=${DNS_UPDATER_SENTRY_DSN}
      - AWS_REGION=${DNS_UPDATER_AWS_REGION}
      - AWS_ACCESS_KEY_ID=${DNS_UPDATER_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${DNS_UPDATER_AWS_SECRET_ACCESS_KEY}
      - HOSTED_ZONE_ID=${DNS_UPDATER_HOSTED_ZONE_ID}
      - RECORD_NAME=${DNS_UPDATER_RECORD_NAME}
    restart: unless-stopped

  the_voice:
    image: tutkowskim/the-voice:2026.08.16.1925
    container_name: TheVoice
    environment:
      - SENTRY_DSN=${THE_VOICE_SENTRY_DSN}
      - TOKEN=${THE_VOICE_TOKEN}
      - OPENAI_API_KEY=${THE_VOICE_OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-5.2
    restart: unless-stopped

  pi_assistant_python_sandbox_image:
    image: python:3.12-alpine
    command: ["true"]
    restart: "no"

  pi_assistant_backend:
    image: tutkowskim/pi-assistant-backend:latest
    container_name: PiAssistantBackend
    environment:
      - OPENAI_API_KEY=${PI_ASSISTANT_OPENAI_API_KEY}
      - GEMINI_API_KEY=${PI_ASSISTANT_GEMINI_API_KEY}
      - GEMINI_BASE_URL=${PI_ASSISTANT_GEMINI_BASE_URL}
      - OLLAMA_BASE_URL=${PI_ASSISTANT_OLLAMA_BASE_URL}
      - APP_DATA_DIR=/app/data
      - DATABASE_URL=sqlite:////app/data/pi-assistant.db
      - APP_TIMEZONE=${PI_ASSISTANT_TIMEZONE:-America/Los_Angeles}
      - MODEL_DISCOVERY_ENABLED=true
      - MODEL_REFRESH_SECONDS=${PI_ASSISTANT_MODEL_REFRESH_SECONDS:-15}
      - MCP_SERVERS=${PI_ASSISTANT_MCP_SERVERS:-[]}
      - DEFAULT_MODEL_ID=${PI_ASSISTANT_DEFAULT_MODEL_ID:-}
      - PYTHON_SANDBOX_IMAGE=python:3.12-alpine
    depends_on:
      pi_assistant_python_sandbox_image:
        condition: service_completed_successfully
    # On the Docker host: stat -c '%g' /var/run/docker.sock
    group_add:
      - "${PI_ASSISTANT_DOCKER_GID:-999}"
    volumes:
      - pi_assistant_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      default:
        aliases:
          - backend
    restart: unless-stopped

  pi_assistant_frontend:
    image: tutkowskim/pi-assistant-frontend:latest
    container_name: PiAssistantFrontend
    depends_on:
      pi_assistant_backend:
        condition: service_healthy
    restart: unless-stopped

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf

configs:
  nginx_config:
    content: |
      server {
          listen 80;
          server_name portainer.tutkowski.com;
          location / {
              proxy_pass http://host.docker.internal:9000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$host;
          }
      }
      server {
          listen 80;
          server_name olamma.tutkowski.com;
          location / {
              proxy_pass http://dev.tutkowski.com:11434;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$host;
          }
      }
      server {
          listen 80;
          server_name chat.tutkowski.com;
          location / {
              proxy_pass http://pi_assistant_frontend:80;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_buffering off;
              proxy_read_timeout 3600s;
          }
      }

volumes:
  pi_assistant_data:
