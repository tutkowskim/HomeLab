services:
  airconnect:
    image: 1activegeek/airconnect:1.8.3
    networks:
      - hostnet
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s

  hermes_agent:
    image: nousresearch/hermes-agent:v0.22.5
    command: ["gateway", "run"]
    networks:
      - appnet
    # Publish only on the Pi 4 where this service runs, for Tailscale Serve.
    ports:
      - target: 9119
        published: 9119
        protocol: tcp
        mode: host
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_MODEL_NAME: hermes-agent
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?Set HERMES_API_SERVER_KEY in Portainer}
    volumes:
      - hermes_data:/opt/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == raspberrypi4
      restart_policy:
        condition: any
        delay: 5s

  discord_mcp_server:
    image: tutkowskim/discord-mcp-server:2026.08.30.2024
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_MCP_BOT_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_MCP_GUILD_ID}
      - DISCORD_ALLOWED_CHANNEL_IDS=${DISCORD_MCP_ALLOWED_CHANNEL_IDS:-*}
      - DISCORD_MCP_HOST=0.0.0.0
      - DISCORD_MCP_PORT=8000
      - DISCORD_MCP_ALLOWED_HOSTS=discord_mcp_server:8000,127.0.0.1:8000,localhost:8000,127.0.0.1:8002,localhost:8002,discord-mcp.dachshund-octatonic.ts.net
      - DISCORD_MCP_MAX_REQUEST_BODY_BYTES=12582912
      - DISCORD_MCP_LOG_LEVEL=DEBUG
      - SENTRY_DSN=${DISCORD_MCP_SENTRY_DSN}
      - SENTRY_ENVIRONMENT=${DISCORD_MCP_SENTRY_ENVIRONMENT:-production}
      - SENTRY_TRACES_SAMPLE_RATE=${DISCORD_MCP_SENTRY_TRACES_SAMPLE_RATE:-1.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - appnet
    # Portainer already publishes port 8000; use 8002 on the Pi 3.
    ports:
      - target: 8000
        published: 8002
        protocol: tcp
        mode: host
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == raspberrypi3
      restart_policy:
        condition: any
        delay: 5s

  kasa_mcp_server:
    image: tutkowskim/kasa-mcp-server:2026.08.30.2024
    container_name: KasaMcpServer
    networks:
      - hostnet
    environment:
      - KASA_USERNAME=${KASA_MCP_USERNAME}
      - KASA_PASSWORD=${KASA_MCP_PASSWORD}
      - KASA_DEVICE_HOSTS=${KASA_MCP_DEVICE_HOSTS}
      - KASA_DISCOVERY_TARGET=${KASA_MCP_DISCOVERY_TARGET:-255.255.255.255}
      - KASA_ALLOWED_DEVICE_IDS=${KASA_MCP_ALLOWED_DEVICE_IDS}
      - KASA_DISCOVERY_TIMEOUT_SECONDS=5
      - KASA_REQUEST_TIMEOUT_SECONDS=10
      - KASA_MAX_CONCURRENT_REQUESTS=4
      - KASA_CACHE_TTL_SECONDS=60
      - KASA_MCP_HOST=0.0.0.0
      - KASA_MCP_PORT=8001
      - KASA_MCP_ALLOWED_HOSTS=127.0.0.1:8001,kasa-mcp.dachshund-octatonic.ts.net
      - KASA_MCP_MAX_REQUEST_BODY_BYTES=4194304
      - KASA_MCP_LOG_LEVEL=DEBUG
      - SENTRY_DSN=${KASA_MCP_SENTRY_DSN}
      - SENTRY_ENVIRONMENT=${KASA_MCP_SENTRY_ENVIRONMENT:-production}
      - SENTRY_TRACES_SAMPLE_RATE=${KASA_MCP_SENTRY_TRACES_SAMPLE_RATE:-1.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == raspberrypi3
      restart_policy:
        condition: any
        delay: 5s

  pihole:
    image: pihole/pihole:2026.10.1
    networks:
      - hostnet
    environment:
      TZ: America/Los_Angeles
      FTLCONF_webserver_api_password: ${PIHOLE_WEB_PASSWORD:?Set PIHOLE_WEB_PASSWORD in Portainer}
      FTLCONF_webserver_port: "9080"
      FTLCONF_dns_listeningMode: "ALL"
      FTLCONF_dns_upstreams: ${PIHOLE_DNS_UPSTREAMS:-1.1.1.1;1.0.0.1}
      # Keep the router responsible for DHCP and the host for timekeeping.
      FTLCONF_dhcp_active: "false"
      FTLCONF_ntp_ipv4_active: "false"
      FTLCONF_ntp_ipv6_active: "false"
      FTLCONF_ntp_sync_active: "false"
    volumes:
      - pihole_data:/etc/pihole
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == raspberrypi4
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s

  open_webui:
    image: ghcr.io/open-webui/open-webui:main-slim
    networks:
      - appnet
    ports:
      - target: 8080
        published: 9081
        protocol: tcp
        mode: host
    environment:
      WEBUI_URL: https://chat.dachshund-octatonic.ts.net
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY:?Set OPEN_WEBUI_SECRET_KEY in Portainer}
      WEBUI_AUTH: "true"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      # Resolve the running task directly, bypassing Swarm's service VIP.
      OPENAI_API_BASE_URL: http://tasks.homelab_hermes_agent:8642/v1
      OPENAI_API_KEY: ${HERMES_API_SERVER_KEY:?Set HERMES_API_SERVER_KEY in Portainer}
    volumes:
      - open_webui_data:/app/backend/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == raspberrypi4
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s

  golink:
    image: ghcr.io/tailscale/golink:main
    environment:
      # Supply through Portainer for initial enrollment, then remove the key.
      TS_AUTHKEY: ${GOLINK_TS_AUTHKEY:-}
    volumes:
      - golink_data:/home/nonroot
    networks:
      - appnet
    # golink joins the tailnet itself as "go"; no host ports are needed.
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == raspberrypi4
      restart_policy:
        condition: any
        delay: 5s

volumes:
  hermes_data:
  golink_data:
  pihole_data:
  open_webui_data:

networks:
  appnet:
    driver: overlay
  hostnet:
    external: true
    name: host
