services:
  airconnect:
    image: 1activegeek/airconnect:1.8.3
    container_name: AirConnect
    network_mode: host
    restart: unless-stopped

  dns_updater:
    image: tutkowskim/dns-updater:2026.01.11.0127
    container_name: DnsUpdater
    environment:
      - PORT=8080
      - SENTRY_DSN=${DNS_UPDATER_SENTRY_DSN}
      - AWS_REGION=${DNS_UPDATER_AWS_REGION}
      - AWS_ACCESS_KEY_ID=${DNS_UPDATER_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${DNS_UPDATER_AWS_SECRET_ACCESS_KEY}
      - HOSTED_ZONE_ID=${DNS_UPDATER_HOSTED_ZONE_ID}
      - RECORD_NAME=${DNS_UPDATER_RECORD_NAME}
    restart: unless-stopped

  the_voice:
    image: tutkowskim/the-voice:2026.08.16.1925
    container_name: TheVoice
    environment:
      - SENTRY_DSN=${THE_VOICE_SENTRY_DSN}
      - TOKEN=${THE_VOICE_TOKEN}
      - OPENAI_API_KEY=${THE_VOICE_OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-5.2
    restart: unless-stopped

  discord_mcp_server:
    image: tutkowskim/discord-mcp-server:2026.08.30.1919
    container_name: DiscordMcpServer
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_MCP_BOT_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_MCP_GUILD_ID}
      - DISCORD_ALLOWED_CHANNEL_IDS=*
      - DISCORD_MCP_HOST=0.0.0.0
      - DISCORD_MCP_PORT=8000
      - DISCORD_MCP_ALLOWED_HOSTS=discord_mcp_server:8000,127.0.0.1:8000,localhost:8000
      - DISCORD_MCP_MAX_REQUEST_BODY_BYTES=12582912
      - DISCORD_MCP_LOG_LEVEL=DEBUG
      - SENTRY_DSN=${DISCORD_MCP_SENTRY_DSN}
      - SENTRY_ENVIRONMENT=${DISCORD_MCP_SENTRY_ENVIRONMENT:-production}
      - SENTRY_TRACES_SAMPLE_RATE=${DISCORD_MCP_SENTRY_TRACES_SAMPLE_RATE:-1.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - discord_mcp
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  discord_mcp_tunnel:
    image: ghcr.io/openai/tunnel-client:latest@sha256:b1e9eb675e6a64775685c323c2af8c2810ea14e1a27c8ce4c68f2994cd7c5e8e
    container_name: DiscordMcpTunnel
    user: "10001:10001"
    environment:
      - HOME=/tmp
      - XDG_CONFIG_HOME=/tmp/tunnel-client
      - CONTROL_PLANE_API_KEY=${DISCORD_MCP_CONTROL_PLANE_API_KEY}
      - CONTROL_PLANE_TUNNEL_ID=${DISCORD_MCP_CONTROL_PLANE_TUNNEL_ID}
      - MCP_SERVER_URL=http://discord_mcp_server:8000/mcp
      - MCP_MAX_CONCURRENT_REQUESTS=4
      - HEALTH_LISTEN_ADDR=:8080
      - LOG_LEVEL=debug
      - LOG_FORMAT=json
    depends_on:
      discord_mcp_server:
        condition: service_healthy
    networks:
      - discord_mcp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  kasa_mcp_server:
    image: tutkowskim/kasa-mcp-server:2026.08.30.1941
    container_name: KasaMcpServer
    network_mode: host
    environment:
      - KASA_USERNAME=${KASA_MCP_USERNAME}
      - KASA_PASSWORD=${KASA_MCP_PASSWORD}
      - KASA_DEVICE_HOSTS=${KASA_MCP_DEVICE_HOSTS}
      - KASA_DISCOVERY_TARGET=${KASA_MCP_DISCOVERY_TARGET:-255.255.255.255}
      - KASA_ALLOWED_DEVICE_IDS=${KASA_MCP_ALLOWED_DEVICE_IDS}
      - KASA_DISCOVERY_TIMEOUT_SECONDS=5
      - KASA_REQUEST_TIMEOUT_SECONDS=10
      - KASA_MAX_CONCURRENT_REQUESTS=4
      - KASA_CACHE_TTL_SECONDS=60
      - KASA_MCP_HOST=127.0.0.1
      - KASA_MCP_PORT=8001
      - KASA_MCP_ALLOWED_HOSTS=127.0.0.1:8001
      - KASA_MCP_MAX_REQUEST_BODY_BYTES=4194304
      - KASA_MCP_LOG_LEVEL=DEBUG
      - SENTRY_DSN=${KASA_MCP_SENTRY_DSN}
      - SENTRY_ENVIRONMENT=${KASA_MCP_SENTRY_ENVIRONMENT:-production}
      - SENTRY_TRACES_SAMPLE_RATE=${KASA_MCP_SENTRY_TRACES_SAMPLE_RATE:-1.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  kasa_mcp_tunnel:
    image: ghcr.io/openai/tunnel-client:latest@sha256:b1e9eb675e6a64775685c323c2af8c2810ea14e1a27c8ce4c68f2994cd7c5e8e
    container_name: KasaMcpTunnel
    user: "10001:10001"
    network_mode: host
    environment:
      - HOME=/tmp
      - XDG_CONFIG_HOME=/tmp/tunnel-client
      - CONTROL_PLANE_API_KEY=${KASA_MCP_CONTROL_PLANE_API_KEY}
      - CONTROL_PLANE_TUNNEL_ID=${KASA_MCP_CONTROL_PLANE_TUNNEL_ID}
      - MCP_SERVER_URL=http://127.0.0.1:8001/mcp
      - MCP_MAX_CONCURRENT_REQUESTS=4
      - HEALTH_LISTEN_ADDR=127.0.0.1:8081
      - LOG_LEVEL=debug
      - LOG_FORMAT=json
    depends_on:
      kasa_mcp_server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf

configs:
  nginx_config:
    content: |
      server {
          listen 80;
          server_name portainer.tutkowski.com;
          location / {
              proxy_pass http://host.docker.internal:9000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$host;
          }
      }

      server {
          listen 80;
          server_name olamma.tutkowski.com;
          location / {
              proxy_pass http://dev.tutkowski.com:11434;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$host;
          }
      }

networks:
  discord_mcp:
    driver: bridge
